events {
    worker_connections 1024;
}

http {
    # Round-robin weights route approximately 95% to FastAPI stable and 5% to
    # the API-compatible BentoML canary. Edit host:port values for deployment.
    upstream arabic_sentiment_versions {
        server arabic-sentiment-stable:8000 weight=95;
        server arabic-sentiment-canary:3000 weight=5;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://arabic_sentiment_versions;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Keep canary failures visible instead of silently retrying stable.
            proxy_next_upstream off;
        }
    }
}
