name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-base.txt

      - name: Install project and development dependencies
        run: >-
          python -m pip install
          --index-url https://pypi.org/simple
          --extra-index-url https://download.pytorch.org/whl/cpu
          -e ".[dev]"

      - name: Run Ruff
        run: ruff check .

      - name: Check formatting with Black
        run: black --check .

  test:
    name: Test and coverage
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-base.txt

      - name: Install project and development dependencies
        run: >-
          python -m pip install
          --index-url https://pypi.org/simple
          --extra-index-url https://download.pytorch.org/whl/cpu
          -e ".[dev]"

      - name: Run tests with coverage
        run: >-
          pytest --cov=src/arabic_sentiment
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=70

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn

  build:
    name: Docker build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: arabic-sentiment-mlops:ci
          cache-to: type=gha,scope=arabic-sentiment-mlops,mode=max

  push:
    name: Push Docker image
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get short commit SHA
        id: commit
        run: echo "sha_short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            m73hashem/arabic-sentiment-mlops:latest
            m73hashem/arabic-sentiment-mlops:sha-${{ steps.commit.outputs.sha_short }}
          cache-from: type=gha,scope=arabic-sentiment-mlops
